# Render blueprint for the Nodemere backend.

services:
  - type: web
    name: nodemere-backend
    env: python
    rootDir: nodemere
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
      - key: SUPABASE_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_ANON_KEY
      - key: SUPABASE_JWT_SECRET
      - key: OPENAI_API_KEY
      - key: OPENAI_ASSISTANT_ID
      - key: ELEVENLABS_WEBHOOK_SECRET
      - key: ELEVENLABS_API_KEY
      - key: ELEVENLABS_AGENT_ID_INBOUND
      - key: ELEVENLABS_AGENT_ID_OUTBOUND
      - key: TWILIO_ACCOUNT_SID
      - key: TWILIO_AUTH_TOKEN
      - key: TWILIO_API_KEY
      - key: TWILIO_API_SECRET
      - key: TWILIO_PHONE_NUMBER
      - key: TWILIO_VOICE_WEBHOOK_URL
      - key: STRIPE_SECRET_KEY
      - key: STRIPE_SECRET_TEST_KEY
      - key: STRIPE_WEBHOOK_SECRET
      - key: STRIPE_CONNECT_CLIENT_ID
      - key: STRIPE_CONNECT_REDIRECT_URI
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      - key: SECRET_KEY
      - key: ALGORITHM
      - key: CORS_ORIGINS
      - key: FRONTEND_BASE_URL
      - key: TEST_MODE
        value: "false"
