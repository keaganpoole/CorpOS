# render.yaml

services:
  # Backend Service (FastAPI)
  - type: web
    name: phonehelper-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=$PYTHONPATH:. uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    rootDir: .
    envVars:
      # Supabase
      - key: SUPABASE_URL
      - key: SUPABASE_KEY
      - key: SUPABASE_JWT_SECRET
      # OpenAI
      - key: OPENAI_API_KEY
      - key: OPENAI_ASSISTANT_ID
      # Stripe
      - key: STRIPE_SECRET_KEY
      - key: STRIPE_SECRET_TEST_KEY
      - key: STRIPE_WEBHOOK_SECRET
      - key: STRIPE_CONNECT_CLIENT_ID
      - key: STRIPE_CONNECT_REDIRECT_URI
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      # JWT auth
      - key: SECRET_KEY
      - key: ALGORITHM

  # Frontend Service (React Static Site)
  - type: static
    name: phonehelper-frontend
    buildCommand: "npm install && npm run build"
    publishPath: "dist"
    rootDir: .
    envVars:
      - key: VITE_SUPABASE_URL
      - key: VITE_SUPABASE_ANON_KEY
      - key: VITE_API_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
