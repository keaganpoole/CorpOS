# render.yaml

services:
  # Backend Service (FastAPI)
  - type: web
    name: nodemere-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    rootDir: .
    envVars:
      # Supabase
      - key: SUPABASE_URL
      - key: SUPABASE_KEY
      - key: SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_JWT_SECRET
      # OpenAI
      - key: OPENAI_API_KEY
      - key: OPENAI_ASSISTANT_ID
      - key: ELEVENLABS_WEBHOOK_SECRET
      - key: ELEVENLABS_API_KEY
      - key: ELEVENLABS_AGENT_ID_INBOUND
      - key: ELEVENLABS_AGENT_ID_OUTBOUND
      - key: NODEMERE_INTERNAL_TOOL_SECRET
      - key: TWILIO_ACCOUNT_SID
      - key: TWILIO_AUTH_TOKEN
      - key: TWILIO_API_KEY
      - key: TWILIO_API_SECRET
      - key: TWILIO_PHONE_NUMBER
      - key: TWILIO_VOICE_WEBHOOK_URL
      - key: BACKEND_PUBLIC_URL
      # System Gmail sender for verification and document-upload links.
      # This is separate from customer-managed scenario integrations.
      - key: GOOGLE_CLIENT_ID
      - key: GOOGLE_CLIENT_SECRET
      - key: SYSTEM_GMAIL_SENDER_EMAIL
      - key: SYSTEM_GMAIL_REFRESH_TOKEN
      # Stripe
      - key: STRIPE_SECRET_KEY
      - key: STRIPE_SECRET_TEST_KEY
      - key: STRIPE_WEBHOOK_SECRET
      - key: STRIPE_CONNECT_CLIENT_ID
      - key: STRIPE_CONNECT_REDIRECT_URI
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      # JWT auth
      - key: SECRET_KEY
      - key: ALGORITHM
      - key: CORS_ORIGINS
      - key: FRONTEND_BASE_URL
      - key: TEST_MODE
        value: "false"

  # Frontend Service (React Static Site)
  - type: static
    name: nodemere-frontend
    buildCommand: "npm install && npm run build"
    publishPath: "dist"
    rootDir: .
    envVars:
      - key: VITE_SUPABASE_URL
      - key: VITE_SUPABASE_ANON_KEY
      - key: VITE_API_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
